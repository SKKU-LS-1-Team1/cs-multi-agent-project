# HTTPS 는 앞단 Caddy가 맡는다 (infra/caddy/Caddyfile, CSA-46). 여기서는 80 포트 HTTP만 받는다.
server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;  # Caddy가 넘겨준 http/https
        proxy_read_timeout 120s;  # 답변 작성 p95 60초 목표 (K1)
    }

    location = /admin {
        return 302 /admin/;
    }

    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri /admin/index.html;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}

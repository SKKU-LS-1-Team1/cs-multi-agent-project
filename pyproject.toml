[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-agent"
version = "0.1.0"
description = "C/S multi-agent system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "langgraph>=0.2.60",
    "langchain-core>=0.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",  # SQLAlchemy Vector 타입 (db/models.py)
    "redis>=5.0",
    "httpx>=0.27",
    "langgraph-checkpoint-postgres>=2.0",  # 그래프 체크포인트 PostgresSaver (graph/builder.py)
    "psycopg-pool>=3.2",
    "lingua-language-detector>=2.0",
]

[project.optional-dependencies]
# 무거운 외부 연동은 extra로 분리한다. CI(테스트)는 fake 구현으로 돌고,
# Docker 이미지는 `uv sync --all-extras`로 전부 설치한다.
# pgvector 는 db/models.py 가 쓰므로 기본 의존성으로 옮겼다. 임베딩 호출은 llm extra 의 google-genai
rag = []
llm = ["langchain-google-genai>=2.0"]
obs = ["langfuse>=2.50"]
data = ["openpyxl>=3.1", "pandas>=2.2", "pyarrow>=16.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# 로컬·GCP VM 공통 구성 (CSA-44 · 김도연): Caddy(HTTPS) · React+Nginx · FastAPI · PostgreSQL(+pgvector) · Redis
# 실행: cp .env.example .env && docker compose up --build
services:
  # 바깥 요청은 Caddy가 받아 nginx로 넘긴다 (CSA-46). .env 의 DOMAIN 이 있으면 HTTPS 인증서를 자동 발급한다.
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    depends_on:
      - api

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cs:cs@postgres:5432/cs
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data/raw:/app/data/raw:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    # 벡터 검색(RAG)도 PostgreSQL 안에서 한다 (pgvector, CSA-18). 확장은 Alembic 첫 리비전에서 켠다.
    image: pgvector/pgvector:0.8.0-pg16
    # 이 컴퓨터(127.0.0.1)에서만 접속 가능. 외부에는 열리지 않는다 (GCP 에서는 SSH 터널로 접속).
    # 로컬 개발: docker compose up -d postgres → .env 의 DATABASE_URL 로 uv run 서버·alembic 이 붙는다.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    environment:
      POSTGRES_USER: cs
      POSTGRES_PASSWORD: cs
      POSTGRES_DB: cs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
  # 발급받은 인증서. 지우면 다시 발급받아야 한다 (Let's Encrypt 발급 횟수 제한 주의)
  caddy_data:
  caddy_config:

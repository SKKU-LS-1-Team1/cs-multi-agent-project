# 로컬·GCP VM 공통 구성 (CSA-44 · 김도연): React+Nginx · FastAPI · PostgreSQL · Redis · ChromaDB
# 실행: cp .env.example .env && docker compose up --build
services:
  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cs:cs@postgres:5432/cs
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
    volumes:
      - ./data/raw:/app/data/raw:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      chromadb:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cs
      POSTGRES_PASSWORD: cs
      POSTGRES_DB: cs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  chromadb:
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma:/data

volumes:
  pgdata:
  chroma:

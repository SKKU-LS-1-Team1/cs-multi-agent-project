# 로컬·GCP VM 공통 구성 (CSA-44 · 김도연): React+Nginx · FastAPI · PostgreSQL(+pgvector) · Redis
#   + Neo4j (사례 학습 지식 그래프, CSA-69. GRAPH_ENABLED=true 일 때만 api 가 쓴다)
# 실행: cp .env.example .env && docker compose up --build
services:
  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    # DOMAIN 과 그 인증서가 있으면 HTTPS(고객/관리자 도메인 분리), 없으면 HTTP (CSA-46)
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./infra/certbot/conf:/etc/letsencrypt:ro
      - ./infra/certbot/www:/var/www/certbot:ro
      - ./infra/nginx/auth:/etc/nginx/auth:ro
    depends_on:
      - api

  # HTTPS 인증서 자동 갱신 (CSA-46). 첫 발급은 infra/gcp/issue-cert.sh. 인증서가 없으면 아무것도 안 한다.
  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - ./infra/certbot/conf:/etc/letsencrypt
      - ./infra/certbot/www:/var/www/certbot
    entrypoint: >-
      /bin/sh -c 'trap exit TERM; while :; do
      certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cs:cs@postgres:5432/cs
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
    volumes:
      - ./data/raw:/app/data/raw:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    # 벡터 검색(RAG)도 PostgreSQL 안에서 한다 (pgvector, CSA-18). 확장은 Alembic 첫 리비전에서 켠다.
    image: pgvector/pgvector:0.8.0-pg16
    # 이 컴퓨터(127.0.0.1)에서만 접속 가능. 외부에는 열리지 않는다 (GCP 에서는 SSH 터널로 접속).
    # 로컬 개발: docker compose up -d postgres → .env 의 DATABASE_URL 로 uv run 서버·alembic 이 붙는다.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    environment:
      POSTGRES_USER: cs
      POSTGRES_PASSWORD: cs
      POSTGRES_DB: cs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  # 사례 학습 지식 그래프 (CSA-69). 벡터 함수(vector.similarity.cosine)가 있는 5.18 이상으로 고정.
  # Postgres 처럼 이 컴퓨터(127.0.0.1)에서만 열린다: Browser http://localhost:7474 · Bolt 7687
  # (GCP 에서는 ssh -L 7474:localhost:7474 -L 7687:localhost:7687 로 터널).
  # 데이터가 수천 노드 수준이라 메모리를 heap 512m · page cache 256m 로 묶는다.
  neo4j:
    image: neo4j:5.26.2-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-cs-graph-local}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
  neo4jdata:

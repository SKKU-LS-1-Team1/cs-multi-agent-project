name: Jira key check

# PR 제목 또는 브랜치 이름에 Jira 이슈 키(예: CSA-12)가 있어야 Jira 이슈에
# 커밋/브랜치/PR/빌드 정보가 자동으로 연결된다.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Require Jira issue key
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if echo "$TITLE $BRANCH" | grep -Eq '\bCSA-[0-9]+\b'; then
            echo "Jira key found."
          else
            echo "::error::PR 제목이나 브랜치 이름에 Jira 이슈 키(예: CSA-12)를 넣어 주세요."
            exit 1
          fi

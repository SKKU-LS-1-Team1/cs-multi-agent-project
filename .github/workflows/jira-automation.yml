name: Jira automation

# 브랜치 생성·PR 이벤트에 맞춰 Jira 이슈 상태를 옮긴다. 규칙은 scripts/jira_automation.py 맨 위 주석.
# 저장소 시크릿 JIRA_BASE_URL · JIRA_USER_EMAIL · JIRA_API_TOKEN 이 없으면 계획만 출력한다.
on:
  create:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Move Jira issues
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/jira_automation.py
